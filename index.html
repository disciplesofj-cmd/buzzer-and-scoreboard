<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교회 학교 부저 & 실시간 점수판</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @keyframes pulse-gold {
      0%, 100% { border-color: rgba(234, 179, 8, 0.8); box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
      50% { border-color: rgba(234, 179, 8, 0.3); box-shadow: 0 0 5px rgba(234, 179, 8, 0.1); }
    }
    .rank-1-card { animation: pulse-gold 2s infinite; }
    
    @keyframes bounce-up {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .runner-avatar { animation: bounce-up 0.3s infinite alternate; }

    /* cross-bg.png 배경 적용 */
    .custom-race-bg {
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.4)), 
                  url('cross-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 드래그 가능한 점수판 창 스타일 */
    #scoreboard-modal {
      position: fixed;
      top: 80px;
      right: 40px;
      cursor: default;
    }
    #scoreboard-header {
      cursor: move;
    }
    
    /* 탭 활성화 디자인 */
    .tab-active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    .tab-inactive { background-color: transparent; color: #94a3b8; border-color: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between select-none">

  <!-- 전체 앱 컨테이너 -->
  <div class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">
    
    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="bg-slate-800 p-6 md:p-10 rounded-2xl shadow-xl max-w-md mx-auto w-full text-center">
      <h1 class="text-2xl font-bold mb-2 text-yellow-400">📖 Buzzer & Scoreboard</h1>
      <p class="text-slate-400 text-sm mb-6">팀전/개인전/복합전 방식에 따라 정보를 입력하세요.</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-sm mb-1 text-slate-300">진행 중인 방 선택</label>
          <select id="select-room" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-yellow-400 text-white font-bold text-yellow-300">
            <option value="">-- 진행자가 만든 방을 불러오는 중... --</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">소속 반 / 팀 이름 <span class="text-xs text-slate-500">(팀전 또는 복합전 시)</span></label>
          <input type="text" id="input-group" placeholder="예: 팀전 또는 복합전 시 (팀명을 입력하세요.)" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-yellow-400 text-white">
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">참가자 개인 이름 <span class="text-xs text-slate-500">(개인전 또는 복합전 시)</span></label>
          <input type="text" id="input-name" placeholder="예: 개인 또는 복합전 시 (이름을 입력하세요.)" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-yellow-400 text-white">
        </div>
        <button onclick="joinGame()" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold rounded-lg transition shadow-lg mt-2">
          참여하기
        </button>
        <button onclick="toggleAdminLogin()" class="w-full py-2 bg-transparent hover:bg-slate-700 text-slate-400 text-xs rounded-lg transition mt-4">
          진행자 모드
        </button>
      </div>
    </div>

    <!-- 진행자 비밀번호 모달 -->
    <div id="admin-login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
      <div class="bg-slate-800 p-6 rounded-xl max-w-xs w-full text-center">
        <h3 class="font-bold mb-3 text-sm">진행자 비밀번호</h3>
        <input type="password" id="admin-pw" placeholder="비밀번호" class="w-full px-3 py-2 bg-slate-700 rounded text-center mb-3 text-sm text-white">
        <div class="flex gap-2">
          <button onclick="verifyAdmin()" class="flex-1 bg-yellow-500 text-slate-950 py-2 rounded text-sm font-bold">확인</button>
          <button onclick="toggleAdminLogin()" class="flex-1 bg-slate-600 py-2 rounded text-sm">취소</button>
        </div>
      </div>
    </div>

    <!-- 진행자 대시보드 -->
    <div id="admin-dashboard" class="hidden bg-slate-800 p-6 md:p-10 rounded-2xl shadow-xl max-w-lg mx-auto w-full">
      <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
        <h2 class="text-xl font-bold text-yellow-400">🛠️ 진행자 방 대시보드</h2>
        <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded">로그아웃</button>
      </div>

      <div class="space-y-6">
        <div class="bg-slate-700/50 p-4 rounded-xl border border-slate-600 space-y-3">
          <h3 class="text-sm font-bold text-slate-200">새로운 퀴즈 방 만들기</h3>
          <div class="flex gap-2">
            <input type="text" id="new-room-code" placeholder="방 이름 (예: 중등부퀴즈)" class="flex-1 px-3 py-2 bg-slate-800 rounded text-sm border border-slate-600 text-white">
            <button onclick="createRoom()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold transition">방 생성</button>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-sm font-bold text-slate-200">개설된 방 목록 (입장 또는 삭제)</h3>
          <div id="admin-room-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        </div>
      </div>
    </div>

    <!-- 2. 게임 메인 화면 (부저 전용 풀스크린) -->
    <div id="game-screen" class="hidden flex flex-col gap-6 w-full">
      
      <!-- 상단 정보바 -->
      <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800 px-6 py-4 rounded-xl gap-4 border border-slate-700">
        <div>
          <span class="text-xs text-slate-400 block">접속 방 / 정보</span>
          <span id="user-display-info" class="font-bold text-yellow-400 text-lg"></span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span id="role-badge" class="px-3 py-1 bg-blue-600 text-xs rounded-full font-bold">참가자</span>
          <button onclick="toggleScoreboardModal(true)" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-lg font-bold transition shadow">📊 실시간 점수</button>
          <button onclick="toggleRaceView(true)" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded-lg font-bold transition shadow">🚩 실시간 순위</button>
          <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded">나가기</button>
        </div>
      </div>

      <!-- 중앙 부저 단독 배치 영역 -->
      <div class="w-full flex justify-center">
        <div id="buzzer-container-box" class="bg-slate-800 p-8 rounded-2xl flex flex-col items-center justify-center text-center border border-slate-700 relative w-full max-w-2xl min-h-[400px] transition-colors duration-300 shadow-2xl">
          
          <div id="winner-announcement" class="mb-6 hidden w-full p-4 rounded-xl border-2 shadow-lg">
            <span id="announcement-title" class="text-xs block uppercase font-bold tracking-wider">🚨 결과</span>
            <span id="winner-text" class="text-2xl md:text-3xl font-black text-white mt-1 block"></span>
            <span id="winner-team-text" class="text-sm text-yellow-300 mt-1 block"></span>
          </div>

          <div id="buzzer-status-text" class="text-slate-400 text-sm mb-6 font-medium">진행자의 시작 신호를 기다리세요...</div>

          <button id="buzzer-btn" onclick="pressBuzzer()" disabled 
            class="w-56 h-56 md:w-72 md:h-72 rounded-full bg-slate-700 text-slate-400 font-black text-3xl md:text-4xl shadow-2xl transition transform active:scale-95 flex items-center justify-center border-8 border-slate-600 cursor-not-allowed">
            BUZZER
          </button>
        </div>
      </div>

      <!-- 진행자 전용 제어 바 -->
      <div id="admin-controls" class="hidden bg-slate-800 px-6 py-4 rounded-xl border border-slate-700 flex flex-col md:flex-row items-center justify-between gap-4">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🛠️ 진행자 제어 패널</h3>
        
        <div class="flex items-center gap-2 bg-slate-700/60 px-3 py-1.5 rounded-lg border border-slate-600">
          <span class="text-xs text-slate-300 whitespace-nowrap">배점:</span>
          <input type="number" id="custom-score-input" value="10" class="w-16 bg-slate-800 px-2 py-1 rounded text-center text-yellow-400 font-bold text-sm focus:outline-none">
          <span class="text-xs text-slate-400">점</span>
        </div>

        <div class="flex gap-2 w-full md:w-auto">
          <button onclick="resetBuzzer()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-xs font-bold transition">부저 리셋</button>
          <button onclick="openGroupModal()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-xs font-bold transition">팀/개인 데이터 관리</button>
        </div>
      </div>

    </div>

    <!-- 3. 전체 화면 수직 레이스 뷰 -->
    <div id="race-screen" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col h-[80vh] w-full relative">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b border-slate-700 pb-3 gap-3">
        <div class="flex items-center gap-2">
          <h2 class="text-xl font-bold text-yellow-400 drop-shadow-md">🌅 푯대를 향한 질주!</h2>
        </div>
        <div class="flex gap-2 w-full md:w-auto justify-between">
          <!-- 팀/개인 레이스 전환 탭 -->
          <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
            <button id="race-tab-team" onclick="setRaceViewMode('team')" class="px-3 py-1 text-xs font-bold rounded tab-active transition">팀 레이스</button>
            <button id="race-tab-player" onclick="setRaceViewMode('player')" class="px-3 py-1 text-xs font-bold rounded tab-inactive transition">개인 레이스</button>
          </div>
          <button onclick="toggleRaceView(false)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition shadow whitespace-nowrap">부저로 복귀</button>
        </div>
      </div>

      <div class="flex-1 relative custom-race-bg rounded-xl border-2 border-yellow-500/40 overflow-hidden flex flex-col items-center shadow-2xl">
        <div class="absolute bottom-3 z-10 bg-slate-900/90 px-4 py-1 rounded-lg border border-slate-600 text-xs font-bold text-slate-300 shadow-md">
          🚩 출발선
        </div>
        <div id="vertical-race-field" class="relative w-full h-full"></div>
      </div>
    </div>

  </div>

  <!-- 📊 마우스 드래그 이동형 실시간 점수판 모달 -->
  <div id="scoreboard-modal" class="hidden bg-slate-900/95 p-3 rounded-2xl w-72 md:w-[340px] border-2 border-yellow-500/50 shadow-2xl flex flex-col max-h-[85vh] z-30 backdrop-blur-md">
    <div id="scoreboard-header" class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2 cursor-move select-none bg-slate-800/80 px-3 py-1.5 rounded-lg">
      <h2 class="font-bold text-xs text-yellow-400 flex items-center gap-1">📊 실시간 점수판</h2>
      <button onclick="toggleScoreboardModal(false)" class="text-slate-400 hover:text-white font-bold text-sm px-1.5">✕</button>
    </div>
    
    <!-- 점수판 팀/개인 전환 탭 -->
    <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-600 mb-2">
      <button id="sb-tab-team" onclick="setSbViewMode('team')" class="flex-1 py-1 text-xs font-bold rounded tab-active transition">팀 순위</button>
      <button id="sb-tab-player" onclick="setSbViewMode('player')" class="flex-1 py-1 text-xs font-bold rounded tab-inactive transition">개인 순위</button>
    </div>

    <div id="scoreboards-container" class="space-y-1.5 flex-1 overflow-y-auto pr-1 max-h-[65vh]"></div>
  </div>

  <!-- 데이터(팀/개인) 추가/삭제 및 순서 관리 모달 -->
  <div id="group-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-6 rounded-xl max-w-sm w-full space-y-4 shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center border-b border-slate-600 pb-2">
        <h3 class="font-bold text-base text-yellow-400">팀/개인 추가 및 관리</h3>
        <button onclick="closeGroupModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      
      <!-- 진행자 모달 탭 -->
      <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
        <button id="admin-tab-team" onclick="setAdminTabMode('team')" class="flex-1 py-1 text-xs font-bold rounded tab-active transition">팀 추가/관리</button>
        <button id="admin-tab-player" onclick="setAdminTabMode('player')" class="flex-1 py-1 text-xs font-bold rounded tab-inactive transition">개인 추가/관리</button>
      </div>

      <div class="space-y-2 bg-slate-700/40 p-3 rounded-lg border border-slate-600">
        <input type="text" id="new-item-name" placeholder="추가할 팀 이름" class="w-full px-3 py-2 bg-slate-800 rounded text-sm border border-slate-600 text-white focus:border-yellow-400 outline-none">
        
        <!-- 개인 추가일 때만 나타나는 소속팀 입력란 -->
        <div id="new-item-team-container" class="hidden">
          <input type="text" id="new-item-team" placeholder="소속 팀 이름 (복합전만)" class="w-full px-3 py-2 bg-slate-800 rounded text-sm border border-slate-600 text-white focus:border-yellow-400 outline-none mt-2">
          <p class="text-[10px] text-slate-400 mt-1 ml-1">* 소속 팀을 입력하면 개인 점수가 팀 점수에도 누적 반영됩니다.</p>
        </div>
        
        <button onclick="addDataItem()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded text-xs font-bold mt-2">추가하기</button>
      </div>
      <div id="modal-group-list" class="space-y-2 max-h-40 overflow-y-auto pt-2 border-t border-slate-700 text-sm"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAf8kTopzYOd4cgGQJh2NSLAMxUksGjyXE",
      authDomain: "project-6d866edc-15a1-4a39-acc.firebaseapp.com",
      databaseURL: "https://project-6d866edc-15a1-4a39-acc-default-rtdb.firebaseio.com",
      projectId: "project-6d866edc-15a1-4a39-acc",
      storageBucket: "project-6d866edc-15a1-4a39-acc.firebasestorage.app",
      messagingSenderId: "294924400638",
      appId: "1:294924400638:web:340020aee979d19b46f2af",
      measurementId: "G-KWZMQQQG18"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = '';
    // 유저 정보 저장
    let currentUser = { displayName: '', teamName: '', isTeamOnly: false, isAdmin: false };
    
    let teamsData = {}; 
    let playersData = {}; 
    let buzzerStatus = 'IDLE'; 

    let sbViewMode = 'team'; 
    let raceViewMode = 'team';
    let adminTabMode = 'team';

    const avatarColors = [
      "bg-red-500", "bg-orange-500", "bg-amber-500", "bg-yellow-500", 
      "bg-lime-500", "bg-green-500", "bg-emerald-500", "bg-teal-500", 
      "bg-cyan-500", "bg-sky-500", "bg-blue-500", "bg-indigo-500", 
      "bg-violet-500", "bg-purple-500", "bg-fuchsia-500", "bg-pink-500", "bg-rose-500"
    ];

    const loginScreen = document.getElementById('login-screen');
    const adminDashboard = document.getElementById('admin-dashboard');
    const gameScreen = document.getElementById('game-screen');
    const raceScreen = document.getElementById('race-screen');
    const selectRoom = document.getElementById('select-room');
    const adminRoomList = document.getElementById('admin-room-list');
    const buzzerBtn = document.getElementById('buzzer-btn');
    const buzzerStatusText = document.getElementById('buzzer-status-text');
    const winnerAnnouncement = document.getElementById('winner-announcement');
    const announcementTitle = document.getElementById('announcement-title');
    const winnerText = document.getElementById('winner-text');
    const winnerTeamText = document.getElementById('winner-team-text');
    const buzzerContainerBox = document.getElementById('buzzer-container-box');
    const scoreboardsContainer = document.getElementById('scoreboards-container');
    const scoreboardModal = document.getElementById('scoreboard-modal');
    const verticalRaceField = document.getElementById('vertical-race-field');
    const adminControls = document.getElementById('admin-controls');
    const roleBadge = document.getElementById('role-badge');
    const userDisplayInfo = document.getElementById('user-display-info');

    // 드래그 로직
    const scoreboardHeader = document.getElementById('scoreboard-header');
    let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;
    scoreboardHeader.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragOffsetX = e.clientX - scoreboardModal.offsetLeft;
      dragOffsetY = e.clientY - scoreboardModal.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      scoreboardModal.style.left = (e.clientX - dragOffsetX) + 'px';
      scoreboardModal.style.top = (e.clientY - dragOffsetY) + 'px';
      scoreboardModal.style.right = 'auto'; 
    });
    document.addEventListener('mouseup', () => { isDragging = false; });

    // 방 목록 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      db.ref('rooms').on('value', (snapshot) => {
        const rooms = snapshot.val() || {};
        const roomKeys = Object.keys(rooms);

        selectRoom.innerHTML = '<option value="">-- 진행 중인 방을 선택하세요 --</option>';
        adminRoomList.innerHTML = '';

        if (roomKeys.length === 0) {
          selectRoom.innerHTML = '<option value="">-- 개설된 방이 없습니다 --</option>';
          adminRoomList.innerHTML = '<div class="text-slate-400 text-xs text-center py-4">방이 없습니다. 방을 만들어주세요.</div>';
          return;
        }

        roomKeys.forEach(roomName => {
          const opt = document.createElement('option');
          opt.value = roomName;
          opt.innerText = roomName;
          selectRoom.appendChild(opt);

          const item = document.createElement('div');
          item.className = "flex justify-between items-center bg-slate-700 px-3 py-2 rounded text-sm";
          item.innerHTML = `
            <span class="font-bold text-yellow-300">📁 ${roomName}</span>
            <div class="flex gap-2">
              <button onclick="enterRoomAsAdmin('${roomName}')" class="bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1 rounded text-xs font-bold">관리입장</button>
              <button onclick="deleteRoom('${roomName}')" class="text-red-400 hover:text-red-300 text-xs font-bold">삭제</button>
            </div>
          `;
          adminRoomList.appendChild(item);
        });
      });
    });

    // 💡 변경점: 팀전/개인전/복합전 참가 로직
    function joinGame() {
      const roomInput = selectRoom.value;
      const groupInput = document.getElementById('input-group').value.trim();
      const nameInput = document.getElementById('input-name').value.trim();

      if (!roomInput) { alert('방을 선택해주세요.'); return; }
      if (!groupInput && !nameInput) { alert('소속 팀 이름이나 참가자 이름 중 하나는 필수로 입력해주세요.'); return; }

      currentRoom = roomInput;
      
      let dispName = '';
      let tName = '';

      if (groupInput && !nameInput) {
        // 1. 팀전 (팀명만 입력)
        dispName = groupInput;
        tName = groupInput;
        currentUser = { displayName: dispName, teamName: tName, isTeamOnly: true, isAdmin: false };
        db.ref(`rooms/${currentRoom}/teams/${groupInput}`).once('value', snap => {
          if (!snap.exists()) db.ref(`rooms/${currentRoom}/teams/${groupInput}`).set({ score: 0, order: Date.now() });
        });
      } else if (!groupInput && nameInput) {
        // 2. 개인전 (개인이름만 입력)
        dispName = nameInput;
        tName = '개인전(팀없음)';
        currentUser = { displayName: dispName, teamName: tName, isTeamOnly: false, isAdmin: false };
        db.ref(`rooms/${currentRoom}/players/${nameInput}`).once('value', snap => {
          if (!snap.exists()) db.ref(`rooms/${currentRoom}/players/${nameInput}`).set({ score: 0, team: tName, order: Date.now() });
        });
      } else {
        // 3. 복합전 (둘 다 입력)
        dispName = nameInput;
        tName = groupInput;
        currentUser = { displayName: dispName, teamName: tName, isTeamOnly: false, isAdmin: false };
        // 팀과 개인 모두 생성
        db.ref(`rooms/${currentRoom}/teams/${groupInput}`).once('value', snap => {
          if (!snap.exists()) db.ref(`rooms/${currentRoom}/teams/${groupInput}`).set({ score: 0, order: Date.now() });
        });
        db.ref(`rooms/${currentRoom}/players/${nameInput}`).once('value', snap => {
          if (!snap.exists()) db.ref(`rooms/${currentRoom}/players/${nameInput}`).set({ score: 0, team: tName, order: Date.now() });
        });
      }

      initGameSession();
    }

    function toggleAdminLogin() { document.getElementById('admin-login-modal').classList.toggle('hidden'); }

    function verifyAdmin() {
      const pw = document.getElementById('admin-pw').value;
      if (pw === '1922') {
        toggleAdminLogin();
        loginScreen.classList.add('hidden');
        adminDashboard.classList.remove('hidden');
      } else { alert('비밀번호가 틀렸습니다.'); }
    }

    function createRoom() {
      const roomName = document.getElementById('new-room-code').value.trim();
      if (!roomName) return;
      db.ref(`rooms/${roomName}/buzzerState`).once('value', (snap) => {
        if (snap.exists()) { alert('이미 존재하는 방입니다.'); return; }
        db.ref(`rooms/${roomName}/buzzerState`).set({ status: 'IDLE', resultType: null, winnerName: null, winnerTeam: null, firstPressTime: null, pendingCheck: false });
        document.getElementById('new-room-code').value = '';
        alert(`'${roomName}' 방이 생성되었습니다!`);
      });
    }

    function enterRoomAsAdmin(roomName) {
      currentRoom = roomName;
      currentUser = { displayName: '진행자 대시보드', teamName: '진행자', isTeamOnly: false, isAdmin: true };
      adminDashboard.classList.add('hidden');
      initGameSession();
    }

    function deleteRoom(roomName) {
      if (confirm(`'${roomName}' 방 데이터를 전부 삭제하시겠습니까?`)) db.ref(`rooms/${roomName}`).remove();
    }

    function initGameSession() {
      loginScreen.classList.add('hidden');
      adminDashboard.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      // 상단바 표기
      let infoText = `[${currentRoom}] ${currentUser.displayName}`;
      if (!currentUser.isAdmin && !currentUser.isTeamOnly && currentUser.teamName !== '개인전(팀없음)') {
        infoText += ` (${currentUser.teamName})`;
      }
      userDisplayInfo.innerText = infoText;

      if (currentUser.isAdmin) {
        roleBadge.innerText = '진행자';
        roleBadge.className = 'px-3 py-1 bg-red-600 text-xs rounded-full font-bold';
        adminControls.classList.remove('hidden');
      } else {
        roleBadge.innerText = '참가자';
        roleBadge.className = 'px-3 py-1 bg-blue-600 text-xs rounded-full font-bold';
        adminControls.classList.add('hidden');
      }
      setupRealtimeListeners();
    }

    function toggleScoreboardModal(show) {
      if (show) scoreboardModal.classList.remove('hidden');
      else scoreboardModal.classList.add('hidden');
    }

    function toggleRaceView(showRace) {
      if (showRace) { gameScreen.classList.add('hidden'); raceScreen.classList.remove('hidden'); renderVerticalRace(); }
      else { raceScreen.classList.add('hidden'); gameScreen.classList.remove('hidden'); }
    }

    function logout() { location.reload(); }

    function setupRealtimeListeners() {
      // 1. 부저 상태
      db.ref(`rooms/${currentRoom}/buzzerState`).on('value', (snapshot) => {
        const state = snapshot.val();
        if (!state) return;
        buzzerStatus = state.status; 

        if (buzzerStatus === 'ACTIVE') {
          buzzerContainerBox.className = "bg-slate-800 p-8 rounded-2xl flex flex-col items-center justify-center text-center border border-slate-700 relative w-full max-w-2xl min-h-[400px] transition-colors duration-300 shadow-2xl";
          buzzerStatusText.innerText = "🚨 지금 부저를 누르세요!";
          winnerAnnouncement.classList.add('hidden');
          
          if (!currentUser.isAdmin) {
            buzzerBtn.disabled = false;
            buzzerBtn.className = "w-56 h-56 md:w-72 md:h-72 rounded-full bg-red-600 hover:bg-red-500 text-white font-black text-3xl md:text-4xl shadow-2xl transition transform active:scale-95 flex items-center justify-center border-8 border-red-400 cursor-pointer animate-bounce";
          } else {
            buzzerBtn.disabled = true;
            buzzerBtn.className = "w-56 h-56 md:w-72 md:h-72 rounded-full bg-slate-700 text-slate-400 font-black text-3xl md:text-4xl shadow-2xl flex items-center justify-center border-8 border-slate-600 cursor-not-allowed";
          }
        } else if (buzzerStatus === 'LOCKED') {
          buzzerBtn.disabled = true;
          buzzerBtn.className = "w-56 h-56 md:w-72 md:h-72 rounded-full bg-slate-700 text-slate-500 font-black text-3xl md:text-4xl shadow-2xl flex items-center justify-center border-8 border-slate-600 cursor-not-allowed";
          buzzerStatusText.innerText = "✨ 결과 판정 완료!";

          if (state.resultType === 'WINNER' && state.winnerName) {
            buzzerContainerBox.className = "bg-emerald-950/80 p-8 rounded-2xl flex flex-col items-center justify-center text-center border-2 border-emerald-500 relative w-full max-w-2xl min-h-[400px] transition-colors duration-300 shadow-2xl";
            announcementTitle.className = "text-xs block uppercase font-bold tracking-wider text-emerald-300";
            announcementTitle.innerText = "🏆 1등 적중!";
            winnerText.innerText = `${state.winnerName} 님!`;
            winnerTeamText.innerText = (state.winnerTeam && state.winnerTeam !== '개인전(팀없음)' && state.winnerTeam !== state.winnerName) ? `소속: ${state.winnerTeam}` : '';
            winnerAnnouncement.className = "mb-6 block w-full bg-emerald-900/50 border-2 border-emerald-500 p-4 rounded-xl shadow-lg";
          } else if (state.resultType === 'TIE') {
            buzzerContainerBox.className = "bg-red-950/80 p-8 rounded-2xl flex flex-col items-center justify-center text-center border-2 border-red-500 relative w-full max-w-2xl min-h-[400px] transition-colors duration-300 shadow-2xl";
            announcementTitle.className = "text-xs block uppercase font-bold tracking-wider text-red-300";
            announcementTitle.innerText = "⚡ 동시타 발생!";
            winnerText.innerText = "❌ 동점 (구분 불가)";
            winnerTeamText.innerText = "다시 누르세요!";
            winnerAnnouncement.className = "mb-6 block w-full bg-red-900/50 border-2 border-red-500 p-4 rounded-xl shadow-lg animate-pulse";
          }
        } else {
          buzzerContainerBox.className = "bg-slate-800 p-8 rounded-2xl flex flex-col items-center justify-center text-center border border-slate-700 relative w-full max-w-2xl min-h-[400px] transition-colors duration-300 shadow-2xl";
          buzzerStatusText.innerText = "진행자의 시작 대기 중...";
          winnerAnnouncement.classList.add('hidden');
          buzzerBtn.disabled = true;
          buzzerBtn.className = "w-56 h-56 md:w-72 md:h-72 rounded-full bg-slate-700 text-slate-400 font-black text-3xl md:text-4xl shadow-2xl flex items-center justify-center border-8 border-slate-600 cursor-not-allowed";
        }
      });

      // 2. 팀 데이터 리스너
      db.ref(`rooms/${currentRoom}/teams`).on('value', (snapshot) => {
        teamsData = snapshot.val() || {};
        renderScoreboards();
        if (!raceScreen.classList.contains('hidden')) renderVerticalRace();
        if (!document.getElementById('group-modal').classList.contains('hidden')) renderAdminModalList();
      });

      // 3. 개인 데이터 리스너
      db.ref(`rooms/${currentRoom}/players`).on('value', (snapshot) => {
        playersData = snapshot.val() || {};
        renderScoreboards();
        if (!raceScreen.classList.contains('hidden')) renderVerticalRace();
        if (!document.getElementById('group-modal').classList.contains('hidden')) renderAdminModalList();
      });
    }

    function pressBuzzer() {
      if (buzzerStatus !== 'ACTIVE') return;
      const buzzerRef = db.ref(`rooms/${currentRoom}/buzzerState`);
      buzzerRef.transaction((current) => {
        if (current && current.status === 'ACTIVE') {
          const now = Date.now();
          if (!current.firstPressTime) {
            current.firstPressTime = now;
            current.winnerName = currentUser.displayName;
            current.winnerTeam = currentUser.teamName;
            current.pendingCheck = true;
            return current;
          } else {
            if (now - current.firstPressTime <= 80) {
              current.status = 'LOCKED';
              current.resultType = 'TIE';
              return current;
            }
          }
        }
        return;
      }, (error, committed) => {
        if (committed && buzzerStatus === 'ACTIVE') {
          setTimeout(() => {
            buzzerRef.once('value', (snap) => {
              const val = snap.val();
              if (val && val.status === 'ACTIVE' && val.pendingCheck) {
                val.status = 'LOCKED';
                val.resultType = 'WINNER';
                buzzerRef.set(val);
              }
            });
          }, 80);
        }
      });
    }

    // 뷰 탭 전환 로직
    function setSbViewMode(mode) {
      sbViewMode = mode;
      document.getElementById('sb-tab-team').className = mode === 'team' ? "flex-1 py-1 text-xs font-bold rounded tab-active transition" : "flex-1 py-1 text-xs font-bold rounded tab-inactive transition";
      document.getElementById('sb-tab-player').className = mode === 'player' ? "flex-1 py-1 text-xs font-bold rounded tab-active transition" : "flex-1 py-1 text-xs font-bold rounded tab-inactive transition";
      renderScoreboards();
    }

    function setRaceViewMode(mode) {
      raceViewMode = mode;
      document.getElementById('race-tab-team').className = mode === 'team' ? "px-3 py-1 text-xs font-bold rounded tab-active transition" : "px-3 py-1 text-xs font-bold rounded tab-inactive transition";
      document.getElementById('race-tab-player').className = mode === 'player' ? "px-3 py-1 text-xs font-bold rounded tab-active transition" : "px-3 py-1 text-xs font-bold rounded tab-inactive transition";
      renderVerticalRace();
    }

    // 💡 변경점: 진행자 모달 탭 변경 시 소속팀 입력란 토글
    function setAdminTabMode(mode) {
      adminTabMode = mode;
      document.getElementById('admin-tab-team').className = mode === 'team' ? "flex-1 py-1 text-xs font-bold rounded tab-active transition" : "flex-1 py-1 text-xs font-bold rounded tab-inactive transition";
      document.getElementById('admin-tab-player').className = mode === 'player' ? "flex-1 py-1 text-xs font-bold rounded tab-active transition" : "flex-1 py-1 text-xs font-bold rounded tab-inactive transition";
      
      const teamInputContainer = document.getElementById('new-item-team-container');
      const nameInput = document.getElementById('new-item-name');
      
      if (mode === 'player') {
        teamInputContainer.classList.remove('hidden');
        nameInput.placeholder = '추가할 참가자(개인) 이름';
      } else {
        teamInputContainer.classList.add('hidden');
        nameInput.placeholder = '추가할 반/팀 이름';
      }
      renderAdminModalList();
    }

    function renderScoreboards() {
      scoreboardsContainer.innerHTML = '';
      const targetData = sbViewMode === 'team' ? teamsData : playersData;
      const entries = Object.entries(targetData);

      if (entries.length === 0) {
        scoreboardsContainer.innerHTML = '<div class="text-slate-500 text-xs text-center py-4">등록된 데이터가 없습니다.</div>';
        return;
      }

      entries.sort((a, b) => a[1].order - b[1].order);

      entries.forEach(([name, data], index) => {
        const card = document.createElement('div');
        // 서브 텍스트 (개인 모드일때만 소속팀 표시)
        let subTextHtml = '';
        if (sbViewMode === 'player' && data.team && data.team !== '개인전(팀없음)') {
          subTextHtml = `<span class="text-[10px] text-slate-400 block -mt-1 truncate max-w-[100px]">${data.team}</span>`;
        }

        card.className = "flex justify-between items-center px-2.5 py-1.5 rounded-md border bg-slate-800/90 border-slate-700 text-xs";
        card.innerHTML = `
          <div class="flex items-center gap-2 truncate mr-1">
            <span class="w-5 text-center font-bold text-slate-400 text-[11px]">${index + 1}</span>
            <div class="flex flex-col truncate">
               <span class="font-bold text-slate-200 truncate" title="${name}">${name}</span>
               ${subTextHtml}
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="font-black text-yellow-400 text-xs">${data.score}점</span>
            ${currentUser.isAdmin ? `
              <div class="flex gap-1">
                <button onclick="updateScoreByInput('${sbViewMode}', '${name}', true)" class="bg-emerald-600 hover:bg-emerald-500 px-1.5 py-0.5 rounded text-[10px] font-bold">+</button>
                <button onclick="updateScoreByInput('${sbViewMode}', '${name}', false)" class="bg-red-600 hover:bg-red-500 px-1.5 py-0.5 rounded text-[10px] font-bold">-</button>
              </div>
            ` : ''}
          </div>
        `;
        scoreboardsContainer.appendChild(card);
      });
    }

    function renderVerticalRace() {
      verticalRaceField.innerHTML = '';
      const targetData = raceViewMode === 'team' ? teamsData : playersData;
      const entries = Object.entries(targetData);

      if (entries.length === 0) {
        verticalRaceField.innerHTML = `<div class="text-slate-200 text-center py-20 font-bold bg-black/40 rounded-xl m-4">등록된 ${raceViewMode==='team'?'팀':'참가자'}가 없습니다.</div>`;
        return;
      }

      let maxScore = 10;
      entries.forEach(([_, data]) => { if (data.score > maxScore) maxScore = data.score; });
      const totalItems = entries.length;

      entries.forEach(([name, data], index) => {
        let percent = Math.max(8, Math.min(85, (data.score / maxScore) * 78));
        if (data.score <= 0) percent = 8;

        let horizontalPercent = totalItems === 1 ? 50 : 5 + (index * (90 / (totalItems - 1)));
        const colorClass = avatarColors[index % avatarColors.length];

        const runnerNode = document.createElement('div');
        runnerNode.className = "absolute transition-all duration-700 ease-out flex flex-col items-center -translate-x-1/2";
        runnerNode.style.bottom = `${percent}%`;
        runnerNode.style.left = `${horizontalPercent}%`;

        runnerNode.innerHTML = `
          <span class="text-[9px] bg-slate-900/90 text-white px-1 py-0.5 rounded border border-slate-700 font-bold shadow whitespace-nowrap mb-0.5">${name}</span>
          <div class="w-6 h-6 md:w-8 md:h-8 rounded-full ${colorClass} flex items-center justify-center shadow-lg border-2 border-white/80 runner-avatar">
            <span class="text-[10px] md:text-sm">🏃</span>
          </div>
        `;
        verticalRaceField.appendChild(runnerNode);
      });
    }

    // 💡 핵심: 개인 점수 변경 시 소속팀 점수도 함께 누적!
    function updateScoreByInput(type, name, isAdd) {
      const inputVal = parseInt(document.getElementById('custom-score-input').value) || 0;
      const amount = isAdd ? inputVal : -inputVal;
      
      if (type === 'player') {
        const pData = playersData[name];
        if(!pData) return;
        // 1. 개인 점수 업데이트
        db.ref(`rooms/${currentRoom}/players/${name}/score`).set((pData.score || 0) + amount);
        
        // 2. 소속 팀이 있다면 팀 점수도 함께 연동
        if (pData.team && pData.team !== '개인전(팀없음)') {
          const tData = teamsData[pData.team];
          const currentTScore = tData ? tData.score : 0;
          db.ref(`rooms/${currentRoom}/teams/${pData.team}/score`).set(currentTScore + amount);
        }
      } else if (type === 'team') {
        // 팀에 직접 점수를 줄 때는 팀 점수만 오름
        const tData = teamsData[name];
        if(!tData) return;
        db.ref(`rooms/${currentRoom}/teams/${name}/score`).set((tData.score || 0) + amount);
      }
    }

    // 진행자 모달 리스트 렌더링
    function renderAdminModalList() {
      const modalGroupList = document.getElementById('modal-group-list');
      modalGroupList.innerHTML = '';
      
      const targetData = adminTabMode === 'team' ? teamsData : playersData;
      const entries = Object.entries(targetData);
      entries.sort((a, b) => a[1].order - b[1].order);

      if(entries.length === 0) {
        modalGroupList.innerHTML = '<div class="text-xs text-slate-500 text-center">목록이 없습니다.</div>';
        return;
      }

      entries.forEach(([name, data]) => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-slate-700 px-3 py-2 rounded text-xs";
        item.innerHTML = `
          <div class="flex flex-col truncate w-32">
            <span class="font-bold truncate text-white">${name}</span>
            ${adminTabMode === 'player' && data.team ? `<span class="text-[10px] text-slate-400">팀: ${data.team}</span>` : ''}
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="moveOrderAdmin('${adminTabMode}', '${name}', 'up')" class="bg-slate-600 hover:bg-slate-500 px-1.5 py-1 rounded font-bold text-white">▲</button>
            <button onclick="moveOrderAdmin('${adminTabMode}', '${name}', 'down')" class="bg-slate-600 hover:bg-slate-500 px-1.5 py-1 rounded font-bold text-white">▼</button>
            <button onclick="deleteDataAdmin('${adminTabMode}', '${name}')" class="text-red-400 hover:text-red-300 font-bold ml-1">삭제</button>
          </div>
        `;
        modalGroupList.appendChild(item);
      });
    }

    function moveOrderAdmin(type, targetName, direction) {
      const targetData = type === 'team' ? teamsData : playersData;
      const entries = Object.entries(targetData);
      entries.sort((a, b) => a[1].order - b[1].order);

      const index = entries.findIndex(([name]) => name === targetName);
      if (index === -1) return;

      if (direction === 'up' && index > 0) {
        const temp = entries[index][1].order;
        entries[index][1].order = entries[index - 1][1].order;
        entries[index - 1][1].order = temp;
      } else if (direction === 'down' && index < entries.length - 1) {
        const temp = entries[index][1].order;
        entries[index][1].order = entries[index + 1][1].order;
        entries[index + 1][1].order = temp;
      }

      let updates = {};
      entries.forEach(([name, val]) => { updates[name] = val; });
      db.ref(`rooms/${currentRoom}/${type === 'team' ? 'teams' : 'players'}`).set(updates);
    }

    // 💡 변경점: 개인 데이터 추가 시 소속팀도 함께 DB에 저장
    function addDataItem() {
      const name = document.getElementById('new-item-name').value.trim();
      if (!name) return;
      
      if (adminTabMode === 'team') {
        db.ref(`rooms/${currentRoom}/teams/${name}`).set({ score: 0, order: Date.now() });
      } else {
        let teamName = document.getElementById('new-item-team').value.trim();
        if(!teamName) teamName = '개인전(팀없음)';
        db.ref(`rooms/${currentRoom}/players/${name}`).set({ score: 0, team: teamName, order: Date.now() });
        // 소속팀이 입력되었다면 해당 팀도 자동으로 생성되게 지원
        if (teamName !== '개인전(팀없음)') {
          db.ref(`rooms/${currentRoom}/teams/${teamName}`).once('value', snap => {
            if (!snap.exists()) db.ref(`rooms/${currentRoom}/teams/${teamName}`).set({ score: 0, order: Date.now() });
          });
        }
      }
      
      document.getElementById('new-item-name').value = '';
      document.getElementById('new-item-team').value = '';
    }

    function deleteDataAdmin(type, name) {
      if (confirm(`정말 '${name}' 항목을 삭제하시겠습니까?`)) {
        db.ref(`rooms/${currentRoom}/${type === 'team' ? 'teams' : 'players'}/${name}`).remove();
      }
    }

    function resetBuzzer() {
      db.ref(`rooms/${currentRoom}/buzzerState`).set({
        status: 'ACTIVE', resultType: null, winnerName: null, winnerTeam: null, firstPressTime: null, pendingCheck: false
      });
    }

    function openGroupModal() {
      document.getElementById('group-modal').classList.remove('hidden');
      renderAdminModalList();
    }
    function closeGroupModal() {
      document.getElementById('group-modal').classList.add('hidden');
    }
  </script>
</body>
